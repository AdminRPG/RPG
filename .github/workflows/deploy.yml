name: Subir al Servidor FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Despliegue FTP
    runs-on: ubuntu-latest
    steps:
    - name: Obtener el código
      uses: actions/checkout@v4

    - name: Subir archivos al servidor
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/
        dangerous-clean-slate: true
        exclude: |
          .git/
          .gitattributes
          .github/
          .gitignore
          .agents/
          .htaccess.disabled
          .DS_Store
          docs/
          front/
          mybb-plugin-rol/
          README.md
          agent.md
          skills-lock.json
          install/
