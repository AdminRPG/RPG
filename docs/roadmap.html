<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap - I-Forge-RPG</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f0e6; --bg-dark: #ebe6d6; --panel: #2d5a27; --gold: #c9a84c;
  --ink: #1a1a1a; --ink-secondary: #5a5a4a; --border: #1e3d1a;
  --shadow: 3px 3px 0 #1e3d1a; --radius: 3px;
  --font-brush: 'Permanent Marker', cursive;
}
@import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');
body {
  font-family: Georgia, 'Palatino Linotype', serif;
  background: var(--bg); color: var(--ink);
  padding: 2rem; max-width: 900px; margin: 0 auto;
}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,rgba(30,61,26,0.04) 0px,rgba(30,61,26,0.04) 1px,transparent 1px,transparent 24px);pointer-events:none;z-index:-1}
h1 { font-family: var(--font-brush); font-size: 2rem; margin-bottom: .3rem; color: var(--panel); text-shadow: 2px 2px 0 var(--gold); letter-spacing: 2px; text-transform: uppercase; }
.subtitle { color: var(--ink-secondary); margin-bottom: 2rem; font-size: .9rem; }
.progress-bar { height: 10px; background: var(--bg-dark); border: 2px solid var(--border); border-radius: var(--radius); margin-bottom: .5rem; overflow: hidden; box-shadow: 2px 2px 0 var(--border); }
.progress-fill { height: 100%; background: var(--panel); transition: width .3s ease; width: 0%; }
.progress-text { font-size: .8rem; color: var(--ink-secondary); margin-bottom: 2rem; text-align: right; font-family: -apple-system, sans-serif; }
.section { background: var(--bg-dark); border: 3px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); margin-bottom: 1rem; overflow: hidden; }
.section-header {
  padding: .8rem 1.2rem; cursor: pointer; user-select: none;
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel); border-bottom: 3px solid var(--border);
}
.section-header:hover { background: #3d7a35; }
.section-header h2 { font-family: var(--font-brush); font-size: .9rem; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
.section-header .meta { font-size: .7rem; color: rgba(255,255,255,0.7); font-family: -apple-system, sans-serif; }
.section-body { padding: .5rem 0; }
.section-body.collapsed { display: none; }
.task { display: flex; align-items: flex-start; gap: .7rem; padding: .5rem 1.2rem; transition: background .15s; border-bottom: 1px dashed var(--border); }
.task:last-child { border-bottom: none; }
.task:hover { background: var(--bg); }
.task input[type=checkbox] { margin-top: 2px; accent-color: var(--panel); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
.task label { cursor: pointer; flex: 1; line-height: 1.5; font-size: .85rem; font-family: -apple-system, sans-serif; }
.task.done label { text-decoration: line-through; color: var(--ink-secondary); }
.task .tag { font-size: .65rem; padding: 2px 8px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg); color: var(--ink-secondary); white-space: nowrap; flex-shrink: 0; font-family: -apple-system, sans-serif; font-weight: 700; text-transform: uppercase; }
.tag-done { background: rgba(63,185,80,0.15); color: #15803d; }
.tag-front { background: rgba(88,166,255,0.15); color: #1a6dd4; }
.tag-back { background: rgba(163,113,247,0.15); color: #7c3aed; }
.tag-plugin { background: rgba(201,168,76,0.15); color: #8b6914; }
.tag-deploy { background: rgba(63,185,80,0.15); color: #15803d; }
.tag-infra { background: rgba(248,81,73,0.15); color: #b91c1c; }
.chevron { transition: transform .2s; font-size: .8rem; color: var(--gold); }
.chevron.open { transform: rotate(180deg); }
.meta-total { font-size: .75rem; color: var(--ink-secondary); margin-top: 1rem; text-align: center; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>

<h1>I-Forge-RPG</h1>
<p class="subtitle">Roadmap de desarrollo personal</p>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">0 / 0 completado</div>

<div id="app"></div>

<p class="meta-total" id="metaTotal"></p>

<script>
const STORAGE_KEY = 'iforge_roadmap';

const ROADMAP = [
  {
    title: '1. Infraestructura y Base',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'i1', label: 'Repositorio GitHub creado y pusheado', tag: 'infra', done: true },
      { id: 'i2', label: 'MyBB 1.8.39 instalado en localhost/iforge', tag: 'infra', done: true },
      { id: 'i3', label: 'BD mybb_foro + rol_foro creadas en Laragon', tag: 'infra', done: true },
      { id: 'i4', label: 'Docs organizados en subcarpetas (backend/, frontend/, estructura/, themes/)', tag: 'infra', done: true },
      { id: 'i5', label: 'Theme XML guardado en docs/themes/ (fuente para regenerar front)', tag: 'infra', done: true },
      { id: 'i6', label: '.htaccess con RewriteCond !-f !-d (funciona en local y produccion)', tag: 'infra', done: true },
      { id: 'i7', label: '.gitignore + deploy.yml ajustados para multi-entorno', tag: 'infra', done: true },
      { id: 'i8', label: 'Skill frontend-design de Anthropic instalado', tag: 'infra', done: true },
      { id: 'i9', label: 'Plugin puente mybb-plugin-rol/ creado con estructura fuente', tag: 'plugin', done: true },
    ]
  },
  {
    title: '2. Fase 0 — Arquitectura Character-Driven',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'a1', label: 'Decisión: foro regido por personajes (cuenta → slots → personajes → posts)', tag: 'back', done: true },
      { id: 'a2', label: 'SQL migration: rol_cuentas + rol_personajes (con cuenta_id, slot_index, activo)', tag: 'back', done: true },
      { id: 'a3', label: 'SQL migration: rol_post_personaje (post ↔ personaje mapping)', tag: 'back', done: true },
      { id: 'a4', label: 'Models: Cuenta.php, Personaje.php (reemplaza Ficha.php), FichaAtributo.php, PostPersonaje.php', tag: 'back', done: true },
      { id: 'a5', label: 'Controllers: CuentaController.php (mi-cuenta, establecer-activo, personaje-activo)', tag: 'back', done: true },
      { id: 'a6', label: 'Controllers: PostController.php (vincular post ↔ personaje)', tag: 'back', done: true },
      { id: 'a7', label: 'Routes: api.php con endpoints de cuenta + post mapping', tag: 'back', done: true },
      { id: 'a8', label: 'Plugin rolbridge.php: login ensureAccount + character selector en newreply/newthread', tag: 'plugin', done: true },
      { id: 'a9', label: 'Plugin rol-widgets.js: hydratacion de widgets postbit, selector, perfil', tag: 'plugin', done: true },
      { id: 'a10', label: 'Arquitectura doc actualizada: jerarquia account → personajes → posts', tag: 'back', done: true },
      { id: 'a11', label: 'Roadmap y todo actualizados', tag: 'infra', done: true },
    ]
  },
  {
    title: '3. Identidad Visual y Tema MyBB',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'v1', label: 'Rellenar docs/frontend/identidad-visual-front.md con valores concretos (nombre, ambientacion, tono, adjetivos)', tag: 'front' },
      { id: 'v2', label: 'Definir paleta de color completa con funcion asignada a cada 色', tag: 'front' },
      { id: 'v3', label: 'Elegir tipografia (display, cuerpo, datos, utilitaria)', tag: 'front' },
      { id: 'v4', label: 'Definir layouts clave (ficha, inventario, economia, postbit, selector de personaje)', tag: 'front' },
      { id: 'v5', label: 'Crear elemento firma (marca de agua del foro)', tag: 'front' },
      { id: 'v6', label: 'Elegir iconografia y animaciones', tag: 'front' },
      { id: 'v7', label: 'Diseñar el tema MyBB desde el XML base en docs/themes/', tag: 'front' },
      { id: 'v8', label: 'Implementar CSS del tema (variables, paleta, tipografia)', tag: 'front' },
      { id: 'v9', label: 'Personalizar templates de MyBB (header, footer, postbit, profile)', tag: 'front' },
      { id: 'v10', label: 'Crear assets graficos (logo, favicon, fondos, iconos de raza/clase)', tag: 'front' },
      { id: 'v11', label: 'Importar tema via ACP y verificar en local', tag: 'front' },
    ]
  },
  {
    title: '4. Plugin Puente MyBB — JWT y Autenticación (Fase 1)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'p1', label: 'JWTService.php: metodos encode/decode con HS256 y secreto desde .env', tag: 'back' },
      { id: 'p2', label: 'AuthMiddleware.php: extraer Bearer token, validar JWT, inyectar user_id en request', tag: 'back' },
      { id: 'p3', label: 'CorsMiddleware.php: configurar CORS (Access-Control-Allow-Origin exacto)', tag: 'back' },
      { id: 'p4', label: 'Implementar endpoint POST /api/v1/auth/refresh en la API', tag: 'back' },
      { id: 'p5', label: 'Activar plugin rolbridge desde ACP de MyBB y verificar login flow', tag: 'plugin' },
    ]
  },
  {
    title: '5. API — Sistema de Fichas y Personajes (Fase 2)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'f1', label: 'Ejecutar migracion SQL: migracion completa 001_cuentas_personajes.sql', tag: 'back' },
      { id: 'f2', label: 'Repositories/PersonajeRepository.php: CRUD contra BD', tag: 'back' },
      { id: 'f3', label: 'FichaController.php: metodos listar, obtener, crear, actualizar, enviar, aprobar, rechazar', tag: 'back' },
      { id: 'f4', label: 'ApprovalService.php: logica de flujo de aprobacion', tag: 'back' },
      { id: 'f5', label: 'Widget postbit: fetch a /personajes/activo/{userId} y renderizar ficha resumida', tag: 'front' },
      { id: 'f6', label: 'Widget perfil: fetch a /personajes/activo/{userId} y renderizar ficha completa', tag: 'front' },
    ]
  },
  {
    title: '6. API — Inventario y Items (Fase 3)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'inv1', label: 'Ejecutar migracion SQL: crear tablas rol_items + rol_inventario', tag: 'back' },
      { id: 'inv2', label: 'Models/Item.php y seeds de items maestro', tag: 'back' },
      { id: 'inv3', label: 'Repositories/ItemRepository.php, InventarioRepository.php', tag: 'back' },
      { id: 'inv4', label: 'InventarioController.php: GET /inventario/{personajeId}', tag: 'back' },
      { id: 'inv5', label: 'InventarioController.php: POST /inventario/{personajeId}/items (staff)', tag: 'back' },
      { id: 'inv6', label: 'InventarioController.php: POST /inventario/transferir', tag: 'back' },
      { id: 'inv7', label: 'Widget inventario en perfil: listar items del personaje', tag: 'front' },
    ]
  },
  {
    title: '7. API — Economía (Fase 4)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'e1', label: 'Ejecutar migracion SQL: crear tablas rol_economia_saldo + rol_economia_transacciones', tag: 'back' },
      { id: 'e2', label: 'Models/Transaccion.php y EconomyService.php con BEGIN/COMMIT/ROLLBACK', tag: 'back' },
      { id: 'e3', label: 'EconomiaController.php: GET /economia/{personajeId}/saldo', tag: 'back' },
      { id: 'e4', label: 'EconomiaController.php: POST /economia/transferir', tag: 'back' },
      { id: 'e5', label: 'EconomiaController.php: GET /economia/{personajeId}/historial', tag: 'back' },
      { id: 'e6', label: 'Widget saldo en postbit/perfil: mostrar monedas del personaje activo', tag: 'front' },
      { id: 'e7', label: 'Formulario de transferencia de economia en perfil', tag: 'front' },
    ]
  },
  {
    title: '8. API — Dados Server-Side (Fase 5)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'd1', label: 'Ejecutar migracion SQL: crear tabla rol_tiradas', tag: 'back' },
      { id: 'd2', label: 'DiceService.php: parsear formula (2d6+3), RNG server-side, detalle JSON', tag: 'back' },
      { id: 'd3', label: 'DadosController.php: POST /dados/tirar con rate limiting', tag: 'back' },
      { id: 'd4', label: 'DadosController.php: GET /dados/historial/{hiloId}', tag: 'back' },
      { id: 'd5', label: 'Boton "Tirar dados" en el editor de post de MyBB (newreply, newthread)', tag: 'front' },
      { id: 'd6', label: 'Insertar resultado del dado en el editor como texto [dado: ...]', tag: 'front' },
      { id: 'd7', label: 'Historial de tiradas visible en el hilo', tag: 'front' },
    ]
  },
  {
    title: '9. Panel de Staff y Moderación (Fase 6)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 's1', label: 'Pagina de aprobacion de fichas en ACP o como pagina propia', tag: 'front' },
      { id: 's2', label: 'Panel de economia: ajustes manuales de saldo, historial completo', tag: 'front' },
      { id: 's3', label: 'Panel de auditoria: tiradas de dados, transferencias', tag: 'front' },
      { id: 's4', label: 'Logs de auditoria inmutables (solo insert, nunca update/delete)', tag: 'back' },
    ]
  },
  {
    title: '10. Endurecimiento y Producción (Fase 7)',
    metaTpl: '{done}/{total}',
    tasks: [
      { id: 'h1', label: 'Rate limiting en /dados/tirar y /economia/transferir (Redis o APCu)', tag: 'back' },
      { id: 'h2', label: 'Validacion de pertenencia (personaje → cuenta → mybb_user_id)', tag: 'back' },
      { id: 'h3', label: 'Sanitizacion de HTML en campos de texto libre (XSS)', tag: 'back' },
      { id: 'h4', label: 'Pruebas unitarias de servicios (Dice, Economy, Approval)', tag: 'back' },
      { id: 'h5', label: 'Pruebas de integracion de endpoints API', tag: 'back' },
      { id: 'h6', label: 'RateLimitMiddleware funcional probado', tag: 'back' },
      { id: 'h7', label: 'Configurar secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD en GitHub', tag: 'deploy' },
      { id: 'h8', label: 'Desplegar a InfinityFree via GitHub Actions', tag: 'deploy' },
      { id: 'h9', label: 'Crear inc/config.php en produccion con credenciales de InfinityFree', tag: 'deploy' },
      { id: 'h10', label: 'Verificar foro funcionando en produccion', tag: 'deploy' },
      { id: 'h11', label: 'Verificar API funcionando en produccion (rol-backend/public/)', tag: 'deploy' },
    ]
  },
];

// Load saved state
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) {}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  let totalAll = 0, doneAll = 0;

  ROADMAP.forEach((section, si) => {
    const sectionTotal = section.tasks.length;
    let sectionDone = 0;
    section.tasks.forEach(t => { if (saved[t.id] === true || t.done === true) sectionDone++; });
    totalAll += sectionTotal; doneAll += sectionDone;

    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <h2>${section.title}</h2>
      <div style="display:flex;align-items:center;gap:.8rem">
        <span class="meta">${sectionDone}/${sectionTotal}</span>
        <span class="chevron open">▼</span>
      </div>`;
    const body = document.createElement('div');
    body.className = 'section-body';
    const isOpen = saved['_sec_'+si] !== false;
    if (!isOpen) { body.classList.add('collapsed'); header.querySelector('.chevron').classList.remove('open'); }

    header.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      body.classList.toggle('collapsed');
      const ch = header.querySelector('.chevron');
      ch.classList.toggle('open');
      saved['_sec_'+si] = !body.classList.contains('collapsed');
      save();
    });

    section.tasks.forEach(t => {
      const taskDiv = document.createElement('div');
      taskDiv.className = 'task';
      const isDone = saved[t.id] === true || t.done === true;
      if (isDone) taskDiv.classList.add('done');
      const tagClass = t.tag ? 'tag-'+t.tag : '';
      taskDiv.innerHTML = `
        <input type="checkbox" id="chk_${t.id}" ${isDone ? 'checked' : ''}>
        <label for="chk_${t.id}">${t.label}</label>
        <span class="tag ${tagClass}">${t.tag || '—'}</span>`;
      taskDiv.querySelector('input').addEventListener('change', function() {
        saved[t.id] = this.checked;
        save();
        render();
      });
      body.appendChild(taskDiv);
    });

    sectionDiv.appendChild(header);
    sectionDiv.appendChild(body);
    app.appendChild(sectionDiv);
  });

  // Update progress
  const pct = totalAll ? Math.round(doneAll / totalAll * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${doneAll} / ${totalAll} completado (${pct}%)`;
  document.getElementById('metaTotal').textContent = `Total: ${doneAll}/${totalAll} | ${ROADMAP.length} secciones`;
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch(e) {}
}

render();
</script>
</body>
</html>
